<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="n8n 工作流程畫布 — FROAV RAG pipeline 視覺化">
  <defs>
    <linearGradient id="n8n-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1322"/>
      <stop offset="1" stop-color="#1a1232"/>
    </linearGradient>
    <radialGradient id="n8n-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ea4b71" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ea4b71" stop-opacity="0"/>
    </radialGradient>
    <pattern id="canvas-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Node template style (uses currentColor via stroke attr where applied) -->
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#n8n-bg)"/>
  <rect width="800" height="450" fill="url(#canvas-dots)"/>
  <circle cx="430" cy="270" r="260" fill="url(#n8n-glow)"/>

  <!-- Eyebrow + title -->
  <text x="48" y="50" font-family="Arial, sans-serif" font-size="11" fill="#ea4b71" letter-spacing="2.6" font-weight="700">COMMUNITY · WORKFLOW TOOL</text>
  <text x="48" y="92" font-family="Arial, sans-serif" font-size="34" fill="#ffffff" font-weight="700">n8n</text>
  <text x="93" y="92" font-family="Arial, sans-serif" font-size="20" fill="#ffffff" fill-opacity="0.85" font-weight="400">＝ node + automation</text>
  <text x="48" y="118" font-family="Arial, sans-serif" font-size="13" fill="#f4efe6" fill-opacity="0.78">用 2026 arXiv 研究框架（FROAV）反推它的原理與技術</text>

  <!-- Workflow canvas - bezier connections (drawn first so nodes sit on top) -->
  <g fill="none" stroke-width="2" stroke-linecap="round">
    <!-- Trigger → RAG retrieval -->
    <path d="M 168 220 C 210 220, 220 170, 268 170" stroke="#ea4b71" stroke-opacity="0.85"/>
    <!-- Trigger → embed -->
    <path d="M 168 240 C 210 240, 220 290, 268 290" stroke="#ea4b71" stroke-opacity="0.55"/>
    <!-- RAG retrieval → LLM Agent -->
    <path d="M 388 170 C 430 170, 440 230, 488 230" stroke="#7dd3c0" stroke-opacity="0.85"/>
    <!-- embed → LLM Agent -->
    <path d="M 388 290 C 430 290, 440 230, 488 230" stroke="#7dd3c0" stroke-opacity="0.85"/>
    <!-- LLM Agent → Judge -->
    <path d="M 608 230 C 640 230, 650 170, 688 170" stroke="#a78bfa" stroke-opacity="0.85"/>
    <!-- LLM Agent → Postgres -->
    <path d="M 608 230 C 640 230, 650 300, 688 300" stroke="#a78bfa" stroke-opacity="0.85"/>
  </g>

  <!-- Animated-look item dots flowing along the wires (static, just visual hint) -->
  <g fill="#ffffff" fill-opacity="0.85">
    <circle cx="212" cy="220" r="3"/>
    <circle cx="232" cy="240" r="2.5" fill-opacity="0.55"/>
    <circle cx="436" cy="200" r="3" fill="#7dd3c0"/>
    <circle cx="436" cy="260" r="3" fill="#7dd3c0"/>
    <circle cx="654" cy="200" r="3" fill="#a78bfa"/>
    <circle cx="654" cy="265" r="3" fill="#a78bfa"/>
  </g>

  <!-- Node: Webhook Trigger -->
  <g transform="translate(78, 195)">
    <rect width="90" height="50" rx="10" fill="#1c2541" stroke="#ea4b71" stroke-width="1.6"/>
    <rect x="0" y="0" width="4" height="50" rx="2" fill="#ea4b71"/>
    <!-- Webhook icon: small lightning/hook -->
    <path d="M 18 20 L 14 32 L 22 30 L 18 42" fill="none" stroke="#ea4b71" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="32" y="22" font-family="Arial, sans-serif" font-size="9.5" fill="#ea4b71" font-weight="700" letter-spacing="0.8">TRIGGER</text>
    <text x="32" y="36" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" fill-opacity="0.9">Webhook</text>
    <!-- output dots -->
    <circle cx="90" cy="20" r="3" fill="#0e1322" stroke="#ea4b71" stroke-width="1.4"/>
    <circle cx="90" cy="40" r="3" fill="#0e1322" stroke="#ea4b71" stroke-width="1.4"/>
  </g>

  <!-- Node: RAG Retrieve -->
  <g transform="translate(268, 145)">
    <rect width="120" height="50" rx="10" fill="#1c2541" stroke="#7dd3c0" stroke-width="1.6"/>
    <rect x="0" y="0" width="4" height="50" rx="2" fill="#7dd3c0"/>
    <!-- Document icon -->
    <rect x="14" y="16" width="14" height="18" rx="2" fill="none" stroke="#7dd3c0" stroke-width="1.4"/>
    <line x1="17" y1="22" x2="25" y2="22" stroke="#7dd3c0" stroke-width="1.2"/>
    <line x1="17" y1="26" x2="25" y2="26" stroke="#7dd3c0" stroke-width="1.2"/>
    <line x1="17" y1="30" x2="22" y2="30" stroke="#7dd3c0" stroke-width="1.2"/>
    <text x="38" y="22" font-family="Arial, sans-serif" font-size="9.5" fill="#7dd3c0" font-weight="700" letter-spacing="0.8">RETRIEVE</text>
    <text x="38" y="36" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" fill-opacity="0.9">Vector Search</text>
    <circle cx="0" cy="25" r="3" fill="#0e1322" stroke="#7dd3c0" stroke-width="1.4"/>
    <circle cx="120" cy="25" r="3" fill="#0e1322" stroke="#7dd3c0" stroke-width="1.4"/>
  </g>

  <!-- Node: Embed Items -->
  <g transform="translate(268, 265)">
    <rect width="120" height="50" rx="10" fill="#1c2541" stroke="#7dd3c0" stroke-width="1.6"/>
    <rect x="0" y="0" width="4" height="50" rx="2" fill="#7dd3c0"/>
    <!-- Stack icon -->
    <g stroke="#7dd3c0" stroke-width="1.4" fill="none">
      <rect x="14" y="14" width="16" height="4" rx="1"/>
      <rect x="14" y="22" width="16" height="4" rx="1"/>
      <rect x="14" y="30" width="16" height="4" rx="1"/>
    </g>
    <text x="38" y="22" font-family="Arial, sans-serif" font-size="9.5" fill="#7dd3c0" font-weight="700" letter-spacing="0.8">EMBED</text>
    <text x="38" y="36" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" fill-opacity="0.9">JSON item[]</text>
    <circle cx="0" cy="25" r="3" fill="#0e1322" stroke="#7dd3c0" stroke-width="1.4"/>
    <circle cx="120" cy="25" r="3" fill="#0e1322" stroke="#7dd3c0" stroke-width="1.4"/>
  </g>

  <!-- Node: LLM Agent (centerpiece) -->
  <g transform="translate(488, 200)">
    <rect width="120" height="60" rx="12" fill="#1c2541" stroke="#a78bfa" stroke-width="1.8"/>
    <rect x="0" y="0" width="4" height="60" rx="2" fill="#a78bfa"/>
    <!-- Spark icon -->
    <g stroke="#a78bfa" stroke-width="1.6" fill="none" stroke-linecap="round">
      <path d="M 20 18 L 20 28 M 15 23 L 25 23"/>
      <path d="M 28 32 L 28 40 M 24 36 L 32 36"/>
    </g>
    <text x="42" y="24" font-family="Arial, sans-serif" font-size="9.5" fill="#a78bfa" font-weight="700" letter-spacing="0.8">AI AGENT</text>
    <text x="42" y="38" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" fill-opacity="0.95">tools + memory</text>
    <text x="42" y="52" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" fill-opacity="0.6">OpenAI / Anthropic</text>
    <circle cx="0" cy="30" r="3" fill="#0e1322" stroke="#a78bfa" stroke-width="1.4"/>
    <circle cx="120" cy="20" r="3" fill="#0e1322" stroke="#a78bfa" stroke-width="1.4"/>
    <circle cx="120" cy="40" r="3" fill="#0e1322" stroke="#a78bfa" stroke-width="1.4"/>
  </g>

  <!-- Node: LLM-as-Judge -->
  <g transform="translate(688, 145)">
    <rect width="80" height="50" rx="10" fill="#1c2541" stroke="#f4a261" stroke-width="1.6"/>
    <rect x="0" y="0" width="4" height="50" rx="2" fill="#f4a261"/>
    <g stroke="#f4a261" stroke-width="1.5" fill="none" stroke-linecap="round">
      <path d="M 16 32 L 22 26 L 28 32"/>
      <path d="M 22 18 L 22 28"/>
    </g>
    <text x="34" y="22" font-family="Arial, sans-serif" font-size="9" fill="#f4a261" font-weight="700" letter-spacing="0.8">JUDGE</text>
    <text x="34" y="36" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" fill-opacity="0.9">eval</text>
    <circle cx="0" cy="25" r="3" fill="#0e1322" stroke="#f4a261" stroke-width="1.4"/>
  </g>

  <!-- Node: Postgres store -->
  <g transform="translate(688, 275)">
    <rect width="80" height="50" rx="10" fill="#1c2541" stroke="#5eaaff" stroke-width="1.6"/>
    <rect x="0" y="0" width="4" height="50" rx="2" fill="#5eaaff"/>
    <!-- DB cylinder -->
    <g stroke="#5eaaff" stroke-width="1.4" fill="none">
      <ellipse cx="22" cy="18" rx="8" ry="3"/>
      <path d="M 14 18 L 14 32"/>
      <path d="M 30 18 L 30 32"/>
      <ellipse cx="22" cy="32" rx="8" ry="3"/>
    </g>
    <text x="36" y="22" font-family="Arial, sans-serif" font-size="9" fill="#5eaaff" font-weight="700" letter-spacing="0.8">STORE</text>
    <text x="36" y="36" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" fill-opacity="0.9">Postgres</text>
    <circle cx="0" cy="25" r="3" fill="#0e1322" stroke="#5eaaff" stroke-width="1.4"/>
  </g>

  <!-- Bottom-left annotation block -->
  <g transform="translate(48, 358)">
    <rect width="280" height="62" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="14" y="22" font-family="Arial, sans-serif" font-size="10" fill="#ea4b71" font-weight="700" letter-spacing="1.5">FAIR-CODE · 400+ NODES · SELF-HOST</text>
    <text x="14" y="40" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.85">Node.js 後端 · 預設 SQLite, 正式部署 Postgres</text>
    <text x="14" y="56" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.85">Queue mode（Redis + Worker）支援高吞吐</text>
  </g>

  <!-- Bottom-right citation -->
  <text x="752" y="428" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" fill-opacity="0.45" letter-spacing="1.2">arXiv:2601.07504 · FROAV · n8n-io/n8n · docs.n8n.io</text>
</svg>
