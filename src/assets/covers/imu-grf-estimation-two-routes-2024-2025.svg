<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="IMU 估計 GRF 兩條 2024-2025 路線：架構優化與自監督學習">
  <defs>
    <linearGradient id="grf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1f2a"/>
      <stop offset="1" stop-color="#101935"/>
    </linearGradient>
    <radialGradient id="grf-glow-left" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f4a261" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#f4a261" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grf-glow-right" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7dd3c0" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#7dd3c0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grf-grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#grf-bg)"/>
  <rect width="800" height="450" fill="url(#grf-grid)"/>
  <circle cx="220" cy="280" r="220" fill="url(#grf-glow-left)"/>
  <circle cx="580" cy="280" r="220" fill="url(#grf-glow-right)"/>

  <!-- Header -->
  <text x="48" y="50" font-family="Arial, sans-serif" font-size="11" fill="#f4a261" letter-spacing="2.6" font-weight="700">METHOD · IMU → GRF ESTIMATION</text>
  <text x="48" y="92" font-family="Arial, sans-serif" font-size="28" fill="#ffffff" font-weight="700">兩條 2024–2025 路線</text>
  <text x="48" y="118" font-family="Arial, sans-serif" font-size="13" fill="#f4efe6" fill-opacity="0.78">架構優化（CNN-BiGRU-Attention） vs 自監督學習（masked transformer SSL）</text>

  <!-- Divider -->
  <line x1="400" y1="150" x2="400" y2="400" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- LEFT PANEL: Architecture optimization (Chen 2025) -->
  <g>
    <text x="60" y="160" font-family="Arial, sans-serif" font-size="11" fill="#f4a261" letter-spacing="1.8" font-weight="700">PATH A · ARCHITECTURE OPTIMIZATION</text>
    <text x="60" y="180" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.9">Chen et al. 2025 · Clin Biomech</text>

    <!-- Architecture stack diagram -->
    <g transform="translate(60, 200)">
      <!-- IMU input -->
      <rect x="0" y="0" width="60" height="22" rx="4" fill="#1c2541" stroke="#f4a261" stroke-width="1.4"/>
      <text x="30" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#f4a261" font-weight="700">IMU</text>

      <!-- arrow -->
      <line x1="60" y1="11" x2="78" y2="11" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.2"/>
      <polygon points="78,11 73,8 73,14" fill="#ffffff" fill-opacity="0.55"/>

      <!-- CNN block -->
      <rect x="80" y="0" width="56" height="22" rx="4" fill="#f4a261" fill-opacity="0.85"/>
      <text x="108" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#0d1f2a" font-weight="700">CNN</text>

      <!-- arrow -->
      <line x1="136" y1="11" x2="154" y2="11" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.2"/>
      <polygon points="154,11 149,8 149,14" fill="#ffffff" fill-opacity="0.55"/>

      <!-- BiGRU block -->
      <rect x="156" y="0" width="68" height="22" rx="4" fill="#f4a261" fill-opacity="0.7"/>
      <text x="190" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#0d1f2a" font-weight="700">BiGRU</text>

      <!-- arrow -->
      <line x1="224" y1="11" x2="242" y2="11" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.2"/>
      <polygon points="242,11 237,8 237,14" fill="#ffffff" fill-opacity="0.55"/>

      <!-- Attention block -->
      <rect x="244" y="0" width="78" height="22" rx="4" fill="#f4a261" fill-opacity="0.55"/>
      <text x="283" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#0d1f2a" font-weight="700">ATTENTION</text>

      <!-- vGRF curve sample -->
      <g transform="translate(0, 50)">
        <text x="0" y="0" font-family="Arial, sans-serif" font-size="9.5" fill="#f4a261" font-weight="700" letter-spacing="1.2">vGRF · ACLR · 25 PATIENTS</text>
        <path d="M 0 40 Q 30 -10 60 5 T 120 30 T 180 28 T 240 38 T 300 40" fill="none" stroke="#f4a261" stroke-width="1.8" stroke-opacity="0.85"/>
        <path d="M 0 42 Q 30 -8 60 8 T 120 32 T 180 30 T 240 40 T 300 42" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="2 3"/>
      </g>

      <!-- Three tasks -->
      <g transform="translate(0, 130)">
        <text x="0" y="0" font-family="Arial, sans-serif" font-size="9.5" fill="#ffffff" fill-opacity="0.55" letter-spacing="1.2">CORRELATION R · 3 TASKS</text>
        <text x="0" y="22" font-family="Arial, sans-serif" font-size="10.5" fill="#ffffff" fill-opacity="0.85">walking</text>
        <text x="120" y="22" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="700">0.953</text>
        <text x="0" y="42" font-family="Arial, sans-serif" font-size="10.5" fill="#ffffff" fill-opacity="0.85">running</text>
        <text x="120" y="42" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="700">0.971</text>
        <text x="0" y="62" font-family="Arial, sans-serif" font-size="10.5" fill="#ffffff" fill-opacity="0.85">stair descent</text>
        <text x="120" y="62" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="700">0.979</text>
      </g>
    </g>
  </g>

  <!-- RIGHT PANEL: Self-Supervised Learning (Tan 2024) -->
  <g>
    <text x="420" y="160" font-family="Arial, sans-serif" font-size="11" fill="#7dd3c0" letter-spacing="1.8" font-weight="700">PATH B · SELF-SUPERVISED LEARNING</text>
    <text x="420" y="180" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.9">Tan et al. 2024 · IEEE TBME</text>

    <!-- Masked sequence visualization -->
    <g transform="translate(420, 200)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="9.5" fill="#7dd3c0" font-weight="700" letter-spacing="1.2">MASKED IMU SEQUENCE</text>
      <!-- Sequence blocks: visible / masked -->
      <g>
        <rect x="0" y="10" width="20" height="18" rx="2" fill="#7dd3c0" fill-opacity="0.85"/>
        <rect x="22" y="10" width="20" height="18" rx="2" fill="#7dd3c0" fill-opacity="0.85"/>
        <rect x="44" y="10" width="20" height="18" rx="2" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.4" stroke-dasharray="2 2"/>
        <rect x="66" y="10" width="20" height="18" rx="2" fill="#7dd3c0" fill-opacity="0.85"/>
        <rect x="88" y="10" width="20" height="18" rx="2" fill="#7dd3c0" fill-opacity="0.85"/>
        <rect x="110" y="10" width="20" height="18" rx="2" fill="#7dd3c0" fill-opacity="0.85"/>
        <rect x="132" y="10" width="20" height="18" rx="2" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.4" stroke-dasharray="2 2"/>
        <rect x="154" y="10" width="20" height="18" rx="2" fill="#7dd3c0" fill-opacity="0.85"/>
        <rect x="176" y="10" width="20" height="18" rx="2" fill="#7dd3c0" fill-opacity="0.85"/>
        <rect x="198" y="10" width="20" height="18" rx="2" fill="#7dd3c0" fill-opacity="0.85"/>
        <rect x="220" y="10" width="20" height="18" rx="2" fill="#7dd3c0" fill-opacity="0.85"/>
        <rect x="242" y="10" width="20" height="18" rx="2" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.4" stroke-dasharray="2 2"/>
        <rect x="264" y="10" width="20" height="18" rx="2" fill="#7dd3c0" fill-opacity="0.85"/>
        <rect x="286" y="10" width="20" height="18" rx="2" fill="#7dd3c0" fill-opacity="0.85"/>
      </g>
      <text x="0" y="46" font-family="Arial, sans-serif" font-size="9.5" fill="#ffffff" fill-opacity="0.55" letter-spacing="1.2">OPTIMAL MASKING RATIO 6.25–12.5%</text>

      <!-- Transformer block -->
      <rect x="80" y="62" width="160" height="24" rx="4" fill="#7dd3c0" fill-opacity="0.7"/>
      <text x="160" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#0d1f2a" font-weight="700">MASKED TRANSFORMER</text>

      <!-- Arrow downward -->
      <line x1="160" y1="88" x2="160" y2="104" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.2"/>
      <polygon points="160,104 156,98 164,98" fill="#ffffff" fill-opacity="0.55"/>

      <!-- Fine-tune box -->
      <rect x="60" y="106" width="200" height="22" rx="4" fill="#1c2541" stroke="#7dd3c0" stroke-width="1.4"/>
      <text x="160" y="121" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#7dd3c0">FINE-TUNE 1–10% labels → 3-axis GRF</text>
    </g>

    <!-- Headline metric -->
    <g transform="translate(420, 360)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="9.5" fill="#ffffff" fill-opacity="0.55" letter-spacing="1.2">LABEL EFFICIENCY</text>
      <text x="0" y="22" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="700">1–10% labels ≈ 100% baseline accuracy</text>
    </g>
  </g>

  <!-- Bottom citation -->
  <text x="752" y="428" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" fill-opacity="0.45" letter-spacing="1.2">Clin Biomech 2025 · 10.1016/j.clinbiomech.2025.106663  /  IEEE TBME 2024 · 10.1109/TBME.2024.3361888</text>
</svg>
