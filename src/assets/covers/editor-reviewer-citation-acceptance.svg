<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="引用編輯/審稿人論文與接受率：三條機制路徑封面">
  <defs>
    <linearGradient id="bg-cite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1a2e"/>
      <stop offset="1" stop-color="#1a1230"/>
    </linearGradient>
    <linearGradient id="path-a-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5d8bb3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5d8bb3" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="path-b-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0fa19d" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0fa19d" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="path-c-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glow-cite">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-cite)"/>

  <!-- Grid lines (subtle) -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="112" x2="800" y2="112"/>
    <line x1="0" y1="224" x2="800" y2="224"/>
    <line x1="0" y1="336" x2="800" y2="336"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Header -->
  <text x="48" y="58" font-family="Arial, sans-serif" font-size="11" fill="#0fa19d" letter-spacing="2.5" font-weight="700">METHOD · PEER REVIEW</text>
  <text x="48" y="95" font-family="Arial, sans-serif" font-size="26" fill="#ffffff" font-weight="700">引用編輯/審稿人能</text>
  <text x="48" y="125" font-family="Arial, sans-serif" font-size="26" fill="#ffffff" font-weight="700">提高接受率嗎？</text>
  <text x="48" y="150" font-family="Arial, sans-serif" font-size="13" fill="#f4efe6" fill-opacity="0.75">三條機制路徑的證據強度評估</text>

  <!-- Three pathway rows -->

  <!-- Path A: Proactive (weak evidence) -->
  <g transform="translate(48, 188)">
    <rect width="704" height="58" rx="8" fill="#5d8bb3" fill-opacity="0.12" stroke="#5d8bb3" stroke-opacity="0.5" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="58" rx="2" fill="#5d8bb3"/>
    <text x="20" y="22" font-family="Arial, sans-serif" font-size="11" fill="#5d8bb3" font-weight="700" letter-spacing="1.5">PATH A · PROACTIVE CITATION</text>
    <text x="20" y="42" font-family="Arial, sans-serif" font-size="12" fill="#f4efe6" fill-opacity="0.9">v1 主動引用編輯 / 審稿人</text>
    <!-- Effect size bar -->
    <g transform="translate(380, 14)">
      <rect width="280" height="30" rx="4" fill="#000" fill-opacity="0.25"/>
      <rect width="60" height="30" rx="4" fill="url(#path-a-grad)"/>
      <text x="14" y="20" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="600">OR 0.84</text>
      <text x="80" y="20" font-family="Arial, sans-serif" font-size="10" fill="#f4efe6" fill-opacity="0.75">CI 0.69-1.03 · 弱證據</text>
    </g>
  </g>

  <!-- Path B: Reactive (strong evidence) -->
  <g transform="translate(48, 256)">
    <rect width="704" height="58" rx="8" fill="#0fa19d" fill-opacity="0.18" stroke="#0fa19d" stroke-opacity="0.65" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="58" rx="2" fill="#0fa19d"/>
    <text x="20" y="22" font-family="Arial, sans-serif" font-size="11" fill="#0fa19d" font-weight="700" letter-spacing="1.5">PATH B · REACTIVE COMPLIANCE</text>
    <text x="20" y="42" font-family="Arial, sans-serif" font-size="12" fill="#f4efe6" fill-opacity="0.95">revision 階段配合審稿引用要求</text>
    <!-- Effect size bar - strong -->
    <g transform="translate(380, 14)">
      <rect width="280" height="30" rx="4" fill="#000" fill-opacity="0.25"/>
      <rect width="252" height="30" rx="4" fill="url(#path-b-grad)" filter="url(#glow-cite)"/>
      <text x="14" y="20" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" font-weight="700">OR 1.61–3.5</text>
      <text x="100" y="20" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" fill-opacity="0.95">穩健正向 · 強證據</text>
    </g>
  </g>

  <!-- Path C: Reviewer pool (theoretical) -->
  <g transform="translate(48, 324)">
    <rect width="704" height="58" rx="8" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="1.2" stroke-dasharray="4 3"/>
    <rect x="0" y="0" width="4" height="58" rx="2" fill="#a78bfa"/>
    <text x="20" y="22" font-family="Arial, sans-serif" font-size="11" fill="#a78bfa" font-weight="700" letter-spacing="1.5">PATH C · REVIEWER POOL</text>
    <text x="20" y="42" font-family="Arial, sans-serif" font-size="12" fill="#f4efe6" fill-opacity="0.9">透過 reference list 影響審稿人組成</text>
    <!-- Effect size bar - theoretical -->
    <g transform="translate(380, 14)">
      <rect width="280" height="30" rx="4" fill="#000" fill-opacity="0.25" stroke="#a78bfa" stroke-opacity="0.4" stroke-dasharray="3 2"/>
      <text x="14" y="20" font-family="Arial, sans-serif" font-size="11" fill="#a78bfa" font-weight="600">無直接 RCT</text>
      <text x="90" y="20" font-family="Arial, sans-serif" font-size="10" fill="#f4efe6" fill-opacity="0.75">機制可信 · 推論性</text>
    </g>
  </g>

  <!-- Sample size badge (right top) -->
  <g transform="translate(580, 50)">
    <rect width="172" height="80" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <text x="86" y="26" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" fill-opacity="0.55" text-anchor="middle" letter-spacing="1.5">SAMPLE SIZE</text>
    <text x="86" y="55" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">37,000+</text>
    <text x="86" y="70" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" fill-opacity="0.55" text-anchor="middle">peer reviews · 4 journals</text>
  </g>

  <!-- Footer -->
  <text x="48" y="425" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" fill-opacity="0.45" letter-spacing="1.2">Wilhite &amp; Fong 2012 · Science 335(6068):542 · DOI 10.1126/science.1212540</text>
  <text x="48" y="440" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" fill-opacity="0.45" letter-spacing="1.2">Barnett A. 2025 · eLife 14:e108748 · DOI 10.7554/eLife.108748</text>
</svg>
