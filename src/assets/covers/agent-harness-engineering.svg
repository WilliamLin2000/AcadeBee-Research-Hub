<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Harness Engineering — 兩篇 2026 arXiv 的互補視角">
  <defs>
    <linearGradient id="harness-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1322"/>
      <stop offset="1" stop-color="#122436"/>
    </linearGradient>
    <radialGradient id="harness-glow" cx="50%" cy="42%" r="55%">
      <stop offset="0" stop-color="#5eaaff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5eaaff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#harness-bg)"/>
  <rect width="800" height="450" fill="url(#harness-glow)"/>

  <!-- title block -->
  <text x="48" y="46" font-family="Arial, sans-serif" font-size="13" fill="#5eaaff" letter-spacing="3" font-weight="700">COMMUNITY · AGENT AI</text>
  <text x="48" y="90" font-family="Arial, sans-serif" font-size="34" fill="#ffffff" font-weight="700">Harness Engineering</text>
  <text x="48" y="118" font-family="Arial, sans-serif" font-size="16" fill="#f4efe6" fill-opacity="0.85">LLM 外殼工程：兩篇 2026 上半年 arXiv 的互補視角</text>
  <line x1="48" y1="134" x2="752" y2="134" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.2"/>

  <!-- panel divider -->
  <line x1="400" y1="156" x2="400" y2="388" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.2"/>
  <circle cx="400" cy="272" r="22" fill="#0e1322" stroke="#7dd3c0" stroke-width="1.6"/>
  <text x="400" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#7dd3c0" font-weight="700">→</text>

  <!-- LEFT PANEL: OPENDEV static harness anatomy -->
  <text x="210" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#5eaaff" font-weight="700" letter-spacing="1">OPENDEV 的靜態外殼</text>

  <g transform="translate(210, 244)">
    <circle r="46" fill="none" stroke="#5eaaff" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="3 5"/>
    <circle r="30" fill="#1c2541" stroke="#5eaaff" stroke-width="2.4"/>
    <text y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#ffffff" font-weight="700">LLM</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="13.5" fill="#ffffff" fill-opacity="0.9">
    <text x="76" y="326">· 依任務路由不同模型</text>
    <text x="76" y="348">· 規劃與執行角色分離</text>
    <text x="76" y="370">· 漸進壓縮舊對話紀錄</text>
  </g>
  <text x="210" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#5eaaff" fill-opacity="0.95" font-weight="700">Bui et al. · arXiv:2603.05344</text>

  <!-- RIGHT PANEL: AHE self-evolving harness -->
  <text x="600" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7dd3c0" font-weight="700" letter-spacing="1">AHE：讓 Harness 自動演化</text>

  <g font-family="Arial, sans-serif" font-size="12" font-weight="700">
    <rect x="462" y="222" width="80" height="34" rx="8" fill="#1c2541" stroke="#a78bfa" stroke-width="2"/>
    <text x="502" y="243" text-anchor="middle" fill="#a78bfa">component</text>

    <rect x="562" y="222" width="80" height="34" rx="8" fill="#1c2541" stroke="#7dd3c0" stroke-width="2"/>
    <text x="602" y="243" text-anchor="middle" fill="#7dd3c0">experience</text>

    <rect x="662" y="222" width="80" height="34" rx="8" fill="#1c2541" stroke="#f4a261" stroke-width="2"/>
    <text x="702" y="243" text-anchor="middle" fill="#f4a261">decision</text>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" fill="none">
    <line x1="542" y1="239" x2="560" y2="239"/>
    <line x1="642" y1="239" x2="660" y2="239"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.6">
    <polygon points="554,235 562,239 554,243"/>
    <polygon points="654,235 662,239 654,243"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="13.5" fill="#ffffff" fill-opacity="0.9">
    <text x="466" y="326">· 元件可被指認、修改</text>
    <text x="466" y="348">· 大量對話蒸餾成證據</text>
    <text x="466" y="370">· 每次修改都驗證預測</text>
  </g>
  <text x="600" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" font-weight="700">
    <tspan fill="#7dd3c0">pass@1 69.7% → 77.0%</tspan>
    <tspan fill="#ffffff" fill-opacity="0.5" font-size="10" font-weight="400"> · arXiv:2604.25850</tspan>
  </text>

  <!-- bottom bar -->
  <g transform="translate(48, 412)">
    <rect width="704" height="30" rx="6" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="16" y="20" font-family="Arial, sans-serif" font-size="12.5" fill="#ffffff" fill-opacity="0.85" font-weight="700">PROMPT → CONTEXT → HARNESS：從靜態外殼到可自動演化的系統</text>
  </g>
</svg>
