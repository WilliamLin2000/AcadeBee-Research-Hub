<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Markerless motion capture 兩條技術路線：2D DeepLabCut 與 3D 單深度攝影機">
  <defs>
    <linearGradient id="mmc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1f1f"/>
      <stop offset="1" stop-color="#0e2a3a"/>
    </linearGradient>
    <radialGradient id="mmc-glow-left" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7dd3c0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7dd3c0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mmc-glow-right" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5eaaff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#5eaaff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="mmc-grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#mmc-bg)"/>
  <rect width="800" height="450" fill="url(#mmc-grid)"/>
  <circle cx="220" cy="280" r="220" fill="url(#mmc-glow-left)"/>
  <circle cx="580" cy="280" r="220" fill="url(#mmc-glow-right)"/>

  <!-- Header -->
  <text x="48" y="50" font-family="Arial, sans-serif" font-size="11" fill="#7dd3c0" letter-spacing="2.6" font-weight="700">METHOD · MARKERLESS MOTION CAPTURE</text>
  <text x="48" y="92" font-family="Arial, sans-serif" font-size="28" fill="#ffffff" font-weight="700">兩條技術路線 · 2025 J Biomech</text>
  <text x="48" y="118" font-family="Arial, sans-serif" font-size="13" fill="#f4efe6" fill-opacity="0.78">2D DeepLabCut（訓練資料比例）vs 3D 單一消費級深度攝影機（TUG）</text>

  <!-- Divider -->
  <line x1="400" y1="150" x2="400" y2="400" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- LEFT PANEL: 2D DeepLabCut -->
  <g>
    <text x="60" y="160" font-family="Arial, sans-serif" font-size="11" fill="#7dd3c0" letter-spacing="1.8" font-weight="700">PATH A · 2D RGB + DEEPLABCUT</text>
    <text x="60" y="180" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.9">Verhoeven et al. 2025</text>

    <!-- Walking stick figure with keypoints (sagittal view) -->
    <g transform="translate(120, 200)">
      <!-- Body skeleton lines -->
      <g stroke="#ffffff" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round" fill="none">
        <!-- head to shoulder -->
        <line x1="60" y1="20" x2="60" y2="55"/>
        <!-- spine -->
        <line x1="60" y1="55" x2="65" y2="105"/>
        <!-- upper arm (back) -->
        <line x1="60" y1="55" x2="48" y2="92"/>
        <!-- forearm (back) -->
        <line x1="48" y1="92" x2="40" y2="125"/>
        <!-- hip -->
        <line x1="65" y1="105" x2="75" y2="115"/>
        <line x1="65" y1="105" x2="55" y2="115"/>
        <!-- front leg thigh -->
        <line x1="75" y1="115" x2="92" y2="155"/>
        <!-- front leg shank -->
        <line x1="92" y1="155" x2="110" y2="195"/>
        <!-- front foot -->
        <line x1="110" y1="195" x2="122" y2="200"/>
        <!-- back leg thigh -->
        <line x1="55" y1="115" x2="40" y2="158"/>
        <!-- back leg shank -->
        <line x1="40" y1="158" x2="50" y2="200"/>
        <!-- back foot -->
        <line x1="50" y1="200" x2="62" y2="202"/>
      </g>
      <!-- Head circle -->
      <circle cx="60" cy="15" r="10" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>

      <!-- Keypoints (DeepLabCut style colored dots) -->
      <g>
        <circle cx="60" cy="15" r="3.5" fill="#7dd3c0"/>
        <circle cx="60" cy="55" r="3.5" fill="#7dd3c0"/>
        <circle cx="65" cy="105" r="3.5" fill="#7dd3c0"/>
        <circle cx="48" cy="92" r="3.5" fill="#7dd3c0"/>
        <circle cx="40" cy="125" r="3.5" fill="#7dd3c0"/>
        <circle cx="75" cy="115" r="3.5" fill="#f4a261"/>
        <circle cx="55" cy="115" r="3.5" fill="#f4a261"/>
        <circle cx="92" cy="155" r="3.5" fill="#f4a261"/>
        <circle cx="40" cy="158" r="3.5" fill="#f4a261"/>
        <circle cx="110" cy="195" r="3.5" fill="#ea4b71"/>
        <circle cx="50" cy="200" r="3.5" fill="#ea4b71"/>
      </g>

      <!-- Sagittal plane label -->
      <text x="180" y="40" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" fill-opacity="0.6" letter-spacing="1.2">SAGITTAL PLANE</text>
      <text x="180" y="58" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.85">15 toddlers + 16 adults</text>
      <text x="180" y="76" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.85">overground + treadmill</text>

      <!-- 25% vs 75% bars -->
      <g transform="translate(180, 100)">
        <text x="0" y="0" font-family="Arial, sans-serif" font-size="9.5" fill="#7dd3c0" font-weight="700" letter-spacing="1.2">TRAINING DATA RATIO</text>
        <text x="0" y="18" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" fill-opacity="0.75">25%</text>
        <rect x="38" y="10" width="40" height="10" rx="2" fill="#7dd3c0" fill-opacity="0.35"/>
        <text x="0" y="38" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" fill-opacity="0.75">75%</text>
        <rect x="38" y="30" width="120" height="10" rx="2" fill="#7dd3c0" fill-opacity="0.85"/>
        <text x="0" y="60" font-family="Arial, sans-serif" font-size="10.5" fill="#ffffff" font-weight="700">ICC ≥ 0.60–0.75</text>
      </g>
    </g>
  </g>

  <!-- RIGHT PANEL: 3D Depth Camera -->
  <g>
    <text x="420" y="160" font-family="Arial, sans-serif" font-size="11" fill="#5eaaff" letter-spacing="1.8" font-weight="700">PATH B · SINGLE DEPTH CAMERA · 3D</text>
    <text x="420" y="180" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.9">Guo et al. 2025 · 3DGait</text>

    <!-- Depth camera icon -->
    <g transform="translate(440, 210)">
      <rect x="0" y="0" width="60" height="32" rx="6" fill="#1c2541" stroke="#5eaaff" stroke-width="1.6"/>
      <circle cx="20" cy="16" r="6" fill="none" stroke="#5eaaff" stroke-width="1.6"/>
      <circle cx="20" cy="16" r="2.5" fill="#5eaaff"/>
      <circle cx="42" cy="16" r="4" fill="none" stroke="#5eaaff" stroke-width="1.4"/>
      <text x="30" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#5eaaff" letter-spacing="1" font-weight="700">DEPTH</text>
    </g>

    <!-- Projection cone -->
    <g fill="none" stroke="#5eaaff" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3 4">
      <line x1="500" y1="210" x2="640" y2="180"/>
      <line x1="500" y1="242" x2="640" y2="345"/>
    </g>

    <!-- TUG stick figure (3D-ish, slight angle) -->
    <g transform="translate(630, 200)">
      <g stroke="#ffffff" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round" fill="none">
        <line x1="42" y1="22" x2="42" y2="58"/>
        <line x1="42" y1="58" x2="44" y2="108"/>
        <line x1="42" y1="58" x2="28" y2="92"/>
        <line x1="28" y1="92" x2="22" y2="125"/>
        <line x1="42" y1="58" x2="58" y2="92"/>
        <line x1="58" y1="92" x2="62" y2="125"/>
        <line x1="44" y1="108" x2="58" y2="118"/>
        <line x1="44" y1="108" x2="32" y2="118"/>
        <line x1="58" y1="118" x2="72" y2="160"/>
        <line x1="72" y1="160" x2="80" y2="200"/>
        <line x1="32" y1="118" x2="20" y2="162"/>
        <line x1="20" y1="162" x2="26" y2="200"/>
      </g>
      <circle cx="42" cy="17" r="10" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>

      <!-- 3D biomarker dots -->
      <g>
        <circle cx="42" cy="17" r="3" fill="#5eaaff"/>
        <circle cx="42" cy="58" r="3" fill="#5eaaff"/>
        <circle cx="28" cy="92" r="3" fill="#5eaaff"/>
        <circle cx="58" cy="92" r="3" fill="#5eaaff"/>
        <circle cx="22" cy="125" r="3" fill="#5eaaff"/>
        <circle cx="62" cy="125" r="3" fill="#5eaaff"/>
        <circle cx="44" cy="108" r="3" fill="#a78bfa"/>
        <circle cx="58" cy="118" r="3" fill="#a78bfa"/>
        <circle cx="32" cy="118" r="3" fill="#a78bfa"/>
        <circle cx="72" cy="160" r="3" fill="#a78bfa"/>
        <circle cx="20" cy="162" r="3" fill="#a78bfa"/>
        <circle cx="80" cy="200" r="3" fill="#ea4b71"/>
        <circle cx="26" cy="200" r="3" fill="#ea4b71"/>
      </g>
    </g>

    <!-- TUG arrow path -->
    <g fill="none" stroke="#5eaaff" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round">
      <path d="M 540 360 C 590 360, 610 350, 640 345" stroke-dasharray="2 3"/>
      <polygon points="640,345 633,341 633,349" fill="#5eaaff" fill-opacity="0.55"/>
    </g>
    <text x="540" y="378" font-family="Arial, sans-serif" font-size="9" fill="#ffffff" fill-opacity="0.55" letter-spacing="1">TUG · 8 adults · 16 trials</text>

    <!-- Metrics block -->
    <g transform="translate(420, 280)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="9.5" fill="#5eaaff" font-weight="700" letter-spacing="1.2">3DGAIT · 49 BIOMARKERS</text>
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.85">Angle MAE</text>
      <text x="90" y="20" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="700">2.3°</text>
      <text x="0" y="40" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.85">PCC</text>
      <text x="90" y="40" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="700">0.75</text>
      <text x="0" y="60" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.85">Temporal err</text>
      <text x="90" y="60" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="700">&lt; 0.03 s</text>
    </g>
  </g>

  <!-- Bottom citation -->
  <text x="752" y="428" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" fill-opacity="0.45" letter-spacing="1.2">J Biomech 2025 · 10.1016/j.jbiomech.2025.112708 · .112738</text>
</svg>
