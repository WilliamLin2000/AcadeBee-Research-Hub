<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="AI Agent 2026 三篇論文跨平台封面">
  <defs>
    <linearGradient id="bg-agent3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1a2e"/>
      <stop offset="1" stop-color="#1a1232"/>
    </linearGradient>
    <filter id="glow-agent3">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-agent3)"/>

  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>

  <text x="48" y="58" font-family="Arial, sans-serif" font-size="11" fill="#0fa19d" letter-spacing="2.5" font-weight="700">COMMUNITY PICKS · CROSS-PLATFORM</text>
  <text x="48" y="98" font-family="Arial, sans-serif" font-size="30" fill="#ffffff" font-weight="700">AI Agent 2026 技術現況</text>
  <text x="48" y="125" font-family="Arial, sans-serif" font-size="14" fill="#f4efe6" fill-opacity="0.85">三篇剛上線的論文，從記憶、工具、評測切進來</text>

  <g transform="translate(48, 160)">
    <rect width="225" height="240" rx="10" fill="#0fa19d" fill-opacity="0.13" stroke="#0fa19d" stroke-opacity="0.55" stroke-width="1.3"/>
    <rect x="0" y="0" width="225" height="4" rx="2" fill="#0fa19d"/>
    <text x="20" y="32" font-family="Arial, sans-serif" font-size="10" fill="#0fa19d" font-weight="700" letter-spacing="1.5">01 · MEMORY</text>
    <text x="20" y="56" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.55">arXiv preprint · 2026-03</text>
    <text x="20" y="92" font-family="Arial, sans-serif" font-size="42" fill="#ffffff" font-weight="700">6</text>
    <text x="20" y="115" font-family="Arial, sans-serif" font-size="12" fill="#f4efe6" fill-opacity="0.85">大家族統一分類</text>
    <text x="20" y="148" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.7">Context-resident</text>
    <text x="20" y="166" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.7">Retrieval-augmented</text>
    <text x="20" y="184" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.7">Reflective</text>
    <text x="20" y="202" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.7">Hierarchical</text>
    <text x="20" y="220" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.7">Policy-learned</text>
  </g>

  <g transform="translate(287, 160)">
    <rect width="225" height="240" rx="10" fill="#f4a261" fill-opacity="0.13" stroke="#f4a261" stroke-opacity="0.55" stroke-width="1.3"/>
    <rect x="0" y="0" width="225" height="4" rx="2" fill="#f4a261"/>
    <text x="20" y="32" font-family="Arial, sans-serif" font-size="10" fill="#f4a261" font-weight="700" letter-spacing="1.5">02 · TOOL USE</text>
    <text x="20" y="56" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.55">PubMed · Nat Biomed Eng · 2026-03</text>
    <text x="20" y="92" font-family="Arial, sans-serif" font-size="42" fill="#ffffff" font-weight="700">77<tspan font-size="22">%</tspan></text>
    <text x="20" y="115" font-family="Arial, sans-serif" font-size="12" fill="#f4efe6" fill-opacity="0.85">BioMed-AQA 成功率</text>
    <text x="20" y="148" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.7">Multi-agent framework</text>
    <text x="20" y="166" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.7">Tool-aware learning</text>
    <text x="20" y="184" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.7">Self-evolving memory</text>
    <text x="20" y="202" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.7">327 biomedical tasks</text>
    <text x="20" y="220" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.7">BioMedAgent</text>
  </g>

  <g transform="translate(526, 160)">
    <rect width="225" height="240" rx="10" fill="#a78bfa" fill-opacity="0.13" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="1.3"/>
    <rect x="0" y="0" width="225" height="4" rx="2" fill="#a78bfa"/>
    <text x="20" y="32" font-family="Arial, sans-serif" font-size="10" fill="#a78bfa" font-weight="700" letter-spacing="1.5">03 · EVALUATION</text>
    <text x="20" y="56" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.55">bioRxiv preprint · 2026-05</text>
    <text x="20" y="92" font-family="Arial, sans-serif" font-size="42" fill="#ffffff" font-weight="700">73.3</text>
    <text x="20" y="115" font-family="Arial, sans-serif" font-size="12" fill="#f4efe6" fill-opacity="0.85">最強組合過程級分數</text>
    <text x="20" y="148" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.7">BiomniBench-DA</text>
    <text x="20" y="166" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.7">100 tasks · 17 types</text>
    <text x="20" y="184" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.7">5 disease areas</text>
    <text x="20" y="202" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.7">Process-level scoring</text>
    <text x="20" y="220" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.7">Architecture &gt; model</text>
  </g>

  <text x="48" y="428" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" fill-opacity="0.45" letter-spacing="1.2">arXiv:2603.07670 · DOI 10.1038/s41551-026-01634-6 · bioRxiv 10.64898/2026.05.12.724604</text>
</svg>
