<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="IMU 脫離力板兩條 2025 路線：物理逆動力學 vs PCA-BP">
  <defs>
    <linearGradient id="km-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1f2a"/>
      <stop offset="1" stop-color="#101935"/>
    </linearGradient>
    <radialGradient id="km-glow-left" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f4a261" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f4a261" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="km-glow-right" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7dd3c0" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#7dd3c0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="km-grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#km-bg)"/>
  <rect width="800" height="450" fill="url(#km-grid)"/>
  <circle cx="210" cy="280" r="220" fill="url(#km-glow-left)"/>
  <circle cx="590" cy="280" r="220" fill="url(#km-glow-right)"/>

  <!-- Header -->
  <text x="48" y="50" font-family="Arial, sans-serif" font-size="11" fill="#f4a261" letter-spacing="2.6" font-weight="700">METHOD · IMU JOINT KINETICS · 2025</text>
  <text x="48" y="88" font-family="Arial, sans-serif" font-size="26" fill="#ffffff" font-weight="700">脫離力板的兩條路線</text>
  <text x="48" y="114" font-family="Arial, sans-serif" font-size="13" fill="#f4efe6" fill-opacity="0.78">物理逆動力學（2 IMU→脛骨負荷）vs. 資料驅動 PCA-BP（8 IMU→中風患者關節扭矩）</text>

  <!-- Divider -->
  <line x1="400" y1="148" x2="400" y2="412" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- LEFT PANEL: Physics-based (van Middelaar 2025) -->
  <text x="60" y="158" font-family="Arial, sans-serif" font-size="11" fill="#f4a261" letter-spacing="1.8" font-weight="700">PATH A · PHYSICS-BASED INVERSE DYNAMICS</text>
  <text x="60" y="176" font-family="Arial, sans-serif" font-size="12.5" fill="#ffffff" fill-opacity="0.9">van Middelaar &amp; Reenalda 2025 · J Biomechanics</text>

  <!-- IMU pair diagram -->
  <g transform="translate(60, 196)">
    <!-- Tibia IMU -->
    <rect x="0" y="0" width="60" height="28" rx="5" fill="#f4a261" fill-opacity="0.85"/>
    <text x="30" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0d1f2a" font-weight="700">TIBIA</text>
    <text x="30" y="23" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0d1f2a">IMU ①</text>
    <!-- Sternum IMU -->
    <rect x="80" y="0" width="68" height="28" rx="5" fill="#f4a261" fill-opacity="0.65"/>
    <text x="114" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0d1f2a" font-weight="700">STERNUM</text>
    <text x="114" y="23" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#0d1f2a">IMU ②</text>
    <!-- Arrow -->
    <line x1="60" y1="14" x2="78" y2="14" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.2"/>
    <polygon points="78,14 73,11 73,17" fill="#ffffff" fill-opacity="0.6"/>

    <!-- Physics chain -->
    <text x="0" y="52" font-family="Arial, sans-serif" font-size="9.5" fill="#f4a261" font-weight="700" letter-spacing="1.2">PHYSICS CHAIN: NO ML REQUIRED</text>
    <!-- CoP → ID → TBL -->
    <rect x="0" y="60" width="52" height="22" rx="4" fill="#1c2541" stroke="#f4a261" stroke-width="1.2"/>
    <text x="26" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" fill="#f4a261">CoP est.</text>
    <line x1="52" y1="71" x2="68" y2="71" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.2"/>
    <polygon points="68,71 63,68 63,74" fill="#ffffff" fill-opacity="0.5"/>
    <rect x="70" y="60" width="54" height="22" rx="4" fill="#1c2541" stroke="#f4a261" stroke-width="1.2"/>
    <text x="97" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" fill="#f4a261">Inv. Dyn.</text>
    <line x1="124" y1="71" x2="140" y2="71" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.2"/>
    <polygon points="140,71 135,68 135,74" fill="#ffffff" fill-opacity="0.5"/>
    <rect x="142" y="60" width="52" height="22" rx="4" fill="#f4a261" fill-opacity="0.75"/>
    <text x="168" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" fill="#0d1f2a" font-weight="700">TBL</text>

    <!-- Metrics -->
    <text x="0" y="116" font-family="Arial, sans-serif" font-size="9.5" fill="#ffffff" fill-opacity="0.5" letter-spacing="1.2">ACCURACY vs FORCE PLATE</text>
    <text x="0" y="138" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.85">CoP correlation</text>
    <text x="200" y="138" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="700">≥ 0.90</text>
    <text x="0" y="160" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.85">Ankle moment rRMSE</text>
    <text x="200" y="160" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="700">≤ 12.9%</text>
    <text x="0" y="182" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.85">Tibial bone load rRMSE</text>
    <text x="200" y="182" font-family="Arial, sans-serif" font-size="14" fill="#f4a261" font-weight="700">≤ 10.2%</text>

    <!-- Population tag -->
    <text x="0" y="210" font-family="Arial, sans-serif" font-size="9.5" fill="#ffffff" fill-opacity="0.45" letter-spacing="0.8">rearfoot strikers · 2.5 / 3.1 / 3.6 m/s · stress fracture risk</text>
  </g>

  <!-- RIGHT PANEL: PCA-BP (Meng 2025) -->
  <text x="420" y="158" font-family="Arial, sans-serif" font-size="11" fill="#7dd3c0" letter-spacing="1.8" font-weight="700">PATH B · DATA-DRIVEN PCA-BP</text>
  <text x="420" y="176" font-family="Arial, sans-serif" font-size="12.5" fill="#ffffff" fill-opacity="0.9">Meng et al. 2025 · J Neuroeng Rehabil</text>

  <g transform="translate(420, 196)">
    <!-- 8 IMU chips -->
    <text x="0" y="12" font-family="Arial, sans-serif" font-size="9.5" fill="#7dd3c0" font-weight="700" letter-spacing="1.2">8 IMU SENSORS (FEET / THIGHS / CALVES / PELVIS / LUMBAR)</text>
    <rect x="0"   y="20" width="30" height="18" rx="3" fill="#7dd3c0" fill-opacity="0.7"/>
    <rect x="34"  y="20" width="30" height="18" rx="3" fill="#7dd3c0" fill-opacity="0.7"/>
    <rect x="68"  y="20" width="30" height="18" rx="3" fill="#7dd3c0" fill-opacity="0.7"/>
    <rect x="102" y="20" width="30" height="18" rx="3" fill="#7dd3c0" fill-opacity="0.7"/>
    <rect x="136" y="20" width="30" height="18" rx="3" fill="#7dd3c0" fill-opacity="0.55"/>
    <rect x="170" y="20" width="30" height="18" rx="3" fill="#7dd3c0" fill-opacity="0.55"/>
    <rect x="204" y="20" width="30" height="18" rx="3" fill="#7dd3c0" fill-opacity="0.4"/>
    <rect x="238" y="20" width="30" height="18" rx="3" fill="#7dd3c0" fill-opacity="0.4"/>

    <!-- PCA reduction -->
    <text x="0" y="58" font-family="Arial, sans-serif" font-size="9.5" fill="#ffffff" fill-opacity="0.5" letter-spacing="1.2">24-DIM KINEMATICS → PCA → 15 PCs (99% variance)</text>
    <rect x="20" y="64" width="90" height="22" rx="4" fill="#1c2541" stroke="#7dd3c0" stroke-width="1.2"/>
    <text x="65" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7dd3c0">24D input</text>
    <line x1="110" y1="75" x2="126" y2="75" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.2"/>
    <polygon points="126,75 121,72 121,78" fill="#ffffff" fill-opacity="0.5"/>
    <rect x="128" y="64" width="60" height="22" rx="4" fill="#7dd3c0" fill-opacity="0.65"/>
    <text x="158" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#0d1f2a" font-weight="700">PCA</text>
    <line x1="188" y1="75" x2="204" y2="75" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.2"/>
    <polygon points="204,75 199,72 199,78" fill="#ffffff" fill-opacity="0.5"/>
    <rect x="206" y="64" width="62" height="22" rx="4" fill="#7dd3c0" fill-opacity="0.9"/>
    <text x="237" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#0d1f2a" font-weight="700">15 PCs</text>

    <!-- BP network -->
    <text x="0" y="110" font-family="Arial, sans-serif" font-size="9.5" fill="#7dd3c0" font-weight="700" letter-spacing="1.2">BP NEURAL NETWORK → 9 JOINT MOMENT COMPONENTS</text>
    <rect x="60" y="116" width="240" height="22" rx="4" fill="#7dd3c0" fill-opacity="0.7"/>
    <text x="180" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#0d1f2a" font-weight="700">Hip · Knee · Ankle × 3 planes</text>

    <!-- Metrics -->
    <text x="0" y="164" font-family="Arial, sans-serif" font-size="9.5" fill="#ffffff" fill-opacity="0.5" letter-spacing="1.2">PERFORMANCE (30 STROKE PATIENTS)</text>
    <text x="0" y="186" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.85">NRMSE all components</text>
    <text x="200" y="186" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="700">4.1–5.3%</text>
    <text x="0" y="208" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.85">RMSE</text>
    <text x="200" y="208" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="700">0.13–0.19 Nm/kg</text>
    <text x="0" y="230" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.85">Pearson CC all moments</text>
    <text x="200" y="230" font-family="Arial, sans-serif" font-size="14" fill="#7dd3c0" font-weight="700">≥ 0.94</text>

    <!-- Population tag -->
    <text x="0" y="256" font-family="Arial, sans-serif" font-size="9.5" fill="#ffffff" fill-opacity="0.45" letter-spacing="0.8">stroke hemiplegia · walking + stair ascent/descent</text>
  </g>

  <!-- Bottom citation -->
  <text x="752" y="432" text-anchor="end" font-family="Arial, sans-serif" font-size="9.5" fill="#ffffff" fill-opacity="0.4" letter-spacing="0.8">J Biomech 2025 · 10.1016/j.jbiomech.2025.112839  /  J Neuroeng Rehabil 2025 · 10.1186/s12984-025-01734-5</text>
</svg>
