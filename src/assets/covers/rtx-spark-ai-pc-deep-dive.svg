<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="NVIDIA RTX Spark AI PC 技術深入">
  <defs>
    <linearGradient id="spark-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1a0d"/>
      <stop offset="1" stop-color="#0d1f2a"/>
    </linearGradient>
    <radialGradient id="spark-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#76b900" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#76b900" stop-opacity="0"/>
    </radialGradient>
    <pattern id="spark-grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#spark-bg)"/>
  <rect width="800" height="450" fill="url(#spark-grid)"/>
  <circle cx="400" cy="240" r="280" fill="url(#spark-glow)"/>

  <text x="48" y="50" font-family="Arial, sans-serif" font-size="11" fill="#76b900" letter-spacing="2.6" font-weight="700">INDUSTRY · NVIDIA RTX SPARK</text>
  <text x="48" y="92" font-family="Arial, sans-serif" font-size="28" fill="#ffffff" font-weight="700">把資料中心 AI 算力塞進 Windows AI PC</text>
  <text x="48" y="118" font-family="Arial, sans-serif" font-size="13" fill="#f4efe6" fill-opacity="0.78">GB10 Superchip · Grace CPU + Blackwell GPU · 128 GB unified memory · 1 PFLOPS</text>

  <g transform="translate(60, 160)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" fill="#76b900" letter-spacing="1.8" font-weight="700">CHIP ARCHITECTURE</text>

    <rect x="0" y="20" width="160" height="60" rx="6" fill="#1c2541" stroke="#76b900" stroke-width="1.6"/>
    <text x="80" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#76b900" font-weight="700">GRACE CPU</text>
    <text x="80" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#f4efe6" fill-opacity="0.75">20 Arm cores</text>
    <text x="80" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#f4efe6" fill-opacity="0.55">co-developed with MediaTek</text>

    <line x1="160" y1="50" x2="200" y2="50" stroke="#76b900" stroke-width="2.4" stroke-dasharray="4 4"/>
    <text x="180" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#76b900" font-weight="700">NVLink C2C</text>

    <rect x="200" y="20" width="160" height="60" rx="6" fill="#76b900" fill-opacity="0.18" stroke="#76b900" stroke-width="1.6"/>
    <text x="280" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="700">BLACKWELL GPU</text>
    <text x="280" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#f4efe6" fill-opacity="0.75">6,144 CUDA cores</text>
    <text x="280" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#f4efe6" fill-opacity="0.55">5th-gen Tensor · FP4</text>

    <rect x="80" y="100" width="200" height="38" rx="6" fill="#0d1f2a" stroke="#7dd3c0" stroke-width="1.4"/>
    <text x="180" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7dd3c0" font-weight="700">UNIFIED MEMORY</text>
    <text x="180" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#f4efe6" fill-opacity="0.75">128 GB LPDDR5X · 300 GB/s</text>

    <text x="0" y="170" font-family="Arial, sans-serif" font-size="9" fill="#f4efe6" fill-opacity="0.55" letter-spacing="1.2">PROCESS · TSMC 3 nm EUV</text>
  </g>

  <g transform="translate(440, 160)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" fill="#76b900" letter-spacing="1.8" font-weight="700">LOCAL LLM THROUGHPUT (GB10)</text>

    <g transform="translate(0, 26)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="10.5" fill="#ffffff" fill-opacity="0.85">120B (GPT-OSS, batch 1)</text>
      <rect x="0" y="6" width="20" height="10" rx="2" fill="#76b900"/>
      <text x="170" y="14" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" font-weight="700">11.66 tok/s</text>
    </g>
    <g transform="translate(0, 52)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="10.5" fill="#ffffff" fill-opacity="0.85">70B Q4</text>
      <rect x="0" y="6" width="60" height="10" rx="2" fill="#76b900"/>
      <text x="170" y="14" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" font-weight="700">35 to 45 tok/s</text>
    </g>
    <g transform="translate(0, 78)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="10.5" fill="#ffffff" fill-opacity="0.85">Qwen 2.5 72B</text>
      <rect x="0" y="6" width="8" height="10" rx="2" fill="#76b900"/>
      <text x="170" y="14" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" font-weight="700">4.6 tok/s</text>
    </g>

    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="300" height="50" rx="6" fill="#1c2541" stroke="#7dd3c0" stroke-width="1.2"/>
      <text x="150" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7dd3c0" letter-spacing="1.4" font-weight="700">DESIGN TRADE-OFF</text>
      <text x="150" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#f4efe6" fill-opacity="0.85">capacity over speed (laptop form factor)</text>
      <text x="150" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="9.5" fill="#f4efe6" fill-opacity="0.6">3× RTX 3090 reaches 124 tok/s but not portable</text>
    </g>
  </g>

  <text x="752" y="428" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" fill-opacity="0.45" letter-spacing="1.2">NVIDIA COMPUTEX 2026 keynote · LMSYS / IntuitionLabs / ProXPC GB10 benchmarks</text>
</svg>
