<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="台灣醫材 AI 產業三個趨勢圖">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2545"/>
      <stop offset="1" stop-color="#061a33"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0a7a77"/>
      <stop offset="1" stop-color="#0fa19d"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#a17d22"/>
      <stop offset="1" stop-color="#d4a537"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#c1523f"/>
      <stop offset="1" stop-color="#e5705f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg3)"/>

  <!-- Horizontal grid lines -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.08">
    <line x1="100" y1="120" x2="720" y2="120"/>
    <line x1="100" y1="200" x2="720" y2="200"/>
    <line x1="100" y1="280" x2="720" y2="280"/>
    <line x1="100" y1="360" x2="720" y2="360"/>
  </g>

  <!-- Baseline -->
  <line x1="100" y1="360" x2="720" y2="360" stroke="#d4a537" stroke-width="2" opacity="0.8"/>

  <!-- Bar 1 (SaMD) -->
  <rect x="180" y="240" width="90" height="120" fill="url(#bar1)" rx="3"/>
  <text x="225" y="220" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#f4efe6">SaMD</text>

  <!-- Bar 2 (健保 DB) -->
  <rect x="355" y="170" width="90" height="190" fill="url(#bar2)" rx="3"/>
  <text x="400" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#f4efe6">NHI DB</text>

  <!-- Bar 3 (Clinical) -->
  <rect x="530" y="110" width="90" height="250" fill="url(#bar3)" rx="3"/>
  <text x="575" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#f4efe6">Clinical</text>

  <!-- Small upward arrows on top of each bar -->
  <g fill="#f4efe6" opacity="0.85">
    <polygon points="225,208 218,220 232,220"/>
    <polygon points="400,138 393,150 407,150"/>
    <polygon points="575,78 568,90 582,90"/>
  </g>

  <!-- Medical cross accent (top-left) -->
  <g transform="translate(80 80)">
    <rect x="-14" y="-4" width="28" height="8" fill="#d4a537" rx="1"/>
    <rect x="-4" y="-14" width="8" height="28" fill="#d4a537" rx="1"/>
  </g>

  <!-- Trend arrow sweeping across -->
  <path d="M 210 255 Q 400 200 565 140" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.35" stroke-dasharray="4 4"/>

  <!-- Labels -->
  <text x="110" y="62" font-family="Arial, sans-serif" font-size="11" fill="#d4a537" letter-spacing="2" font-weight="700">TAIWAN MEDAI 2026</text>
  <text x="100" y="400" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" opacity="0.6" letter-spacing="1.5">THREE INDUSTRY TRENDS</text>
</svg>
