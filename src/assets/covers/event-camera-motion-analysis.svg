<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Event camera 動作分析入門">
  <defs>
    <linearGradient id="bg-event" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2545"/>
      <stop offset="1" stop-color="#0fa19d"/>
    </linearGradient>
    <radialGradient id="event-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d4a434" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#d4a434" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-event)"/>

  <!-- Subtle grid -->
  <g stroke="#f4efe6" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>

  <!-- Left panel: frame-based vs event-based comparison -->
  <g transform="translate(60 130)">
    <text x="0" y="-10" font-family="Arial, sans-serif" font-size="11" fill="#d4a434" letter-spacing="1.5" font-weight="700">FRAME vs EVENT</text>

    <!-- Frame-based stack -->
    <g>
      <rect x="0" y="10" width="60" height="42" rx="4" fill="#f4efe6" opacity="0.18" stroke="#f4efe6" stroke-opacity="0.55"/>
      <rect x="0" y="60" width="60" height="42" rx="4" fill="#f4efe6" opacity="0.18" stroke="#f4efe6" stroke-opacity="0.55"/>
      <rect x="0" y="110" width="60" height="42" rx="4" fill="#f4efe6" opacity="0.18" stroke="#f4efe6" stroke-opacity="0.55"/>
      <text x="30" y="172" font-family="Arial, sans-serif" font-size="10" fill="#f4efe6" opacity="0.85" text-anchor="middle">30 fps</text>
    </g>

    <!-- Event stream: per-pixel async dots -->
    <g transform="translate(95 0)">
      <rect x="0" y="10" width="120" height="142" rx="4" fill="#0b2545" opacity="0.55" stroke="#d4a434" stroke-opacity="0.35"/>
      <g fill="#e85d4f">
        <circle cx="14" cy="30" r="2.5"/>
        <circle cx="32" cy="44" r="2.5"/>
        <circle cx="48" cy="56" r="2.5"/>
        <circle cx="64" cy="68" r="2.5"/>
        <circle cx="80" cy="80" r="2.5"/>
        <circle cx="96" cy="92" r="2.5"/>
      </g>
      <g fill="#0fa19d">
        <circle cx="22" cy="100" r="2.5"/>
        <circle cx="42" cy="112" r="2.5"/>
        <circle cx="58" cy="124" r="2.5"/>
        <circle cx="74" cy="138" r="2.5"/>
        <circle cx="90" cy="32" r="2.5"/>
      </g>
      <g fill="#d4a434">
        <circle cx="100" cy="60" r="2.5"/>
        <circle cx="20" cy="64" r="2.5"/>
        <circle cx="50" cy="88" r="2.5"/>
        <circle cx="70" cy="48" r="2.5"/>
      </g>
      <text x="60" y="172" font-family="Arial, sans-serif" font-size="10" fill="#f4efe6" opacity="0.85" text-anchor="middle">async events</text>
    </g>
  </g>

  <!-- Center panel: key specs -->
  <g transform="translate(330 130)">
    <rect x="0" y="0" width="170" height="180" rx="14" fill="#f4efe6" opacity="0.97"/>
    <rect x="0" y="0" width="170" height="34" rx="14" fill="#e85d4f"/>
    <text x="14" y="22" font-family="Arial, sans-serif" font-size="13" fill="#f4efe6" font-weight="700">EVENT CAMERA</text>
    <text x="85" y="62" font-family="Arial, sans-serif" font-size="11" fill="#0b2545" opacity="0.7" text-anchor="middle">temporal resolution</text>
    <text x="85" y="84" font-family="Arial, sans-serif" font-size="22" fill="#0b2545" font-weight="700" text-anchor="middle">μs</text>
    <line x1="20" y1="98" x2="150" y2="98" stroke="#0b2545" stroke-opacity="0.15" stroke-width="1"/>
    <text x="85" y="118" font-family="Arial, sans-serif" font-size="11" fill="#0b2545" opacity="0.7" text-anchor="middle">dynamic range</text>
    <text x="85" y="140" font-family="Arial, sans-serif" font-size="22" fill="#0b2545" font-weight="700" text-anchor="middle">140 dB</text>
    <text x="85" y="160" font-family="Arial, sans-serif" font-size="9" fill="#0b2545" opacity="0.55" text-anchor="middle">vs traditional 60 dB</text>
  </g>

  <!-- Right panel: motion + figure silhouette running -->
  <g transform="translate(560 130)">
    <text x="0" y="-10" font-family="Arial, sans-serif" font-size="11" fill="#d4a434" letter-spacing="1.5" font-weight="700">MOTION CUES</text>
    <circle cx="90" cy="90" r="80" fill="url(#event-glow)"/>

    <!-- Stick figure mid-stride -->
    <g stroke="#f4efe6" stroke-width="3" stroke-linecap="round" fill="none">
      <circle cx="90" cy="40" r="8" fill="#f4efe6"/>
      <line x1="90" y1="48" x2="90" y2="100"/>
      <line x1="90" y1="62" x2="68" y2="80"/>
      <line x1="90" y1="62" x2="115" y2="78"/>
      <line x1="90" y1="100" x2="72" y2="138"/>
      <line x1="90" y1="100" x2="112" y2="140"/>
    </g>

    <!-- Edge events around the figure -->
    <g fill="#e85d4f">
      <circle cx="76" cy="78" r="1.8"/>
      <circle cx="106" cy="80" r="1.8"/>
      <circle cx="68" cy="120" r="1.8"/>
      <circle cx="115" cy="125" r="1.8"/>
      <circle cx="60" cy="100" r="1.8"/>
    </g>
    <g fill="#0fa19d">
      <circle cx="125" cy="100" r="1.8"/>
      <circle cx="118" cy="50" r="1.8"/>
      <circle cx="62" cy="50" r="1.8"/>
      <circle cx="100" cy="142" r="1.8"/>
    </g>
    <g fill="#d4a434">
      <circle cx="84" cy="35" r="1.8"/>
      <circle cx="135" cy="80" r="1.8"/>
      <circle cx="48" cy="76" r="1.8"/>
    </g>
    <text x="90" y="178" font-family="Arial, sans-serif" font-size="10" fill="#f4efe6" opacity="0.85" text-anchor="middle">heel-strike · toe-off</text>
  </g>

  <!-- Title -->
  <text x="60" y="58" font-family="Arial, sans-serif" font-size="11" fill="#d4a434" letter-spacing="2" font-weight="700">METHOD · MAY 2026</text>
  <text x="60" y="86" font-family="Arial, sans-serif" font-size="22" fill="#f4efe6" font-weight="700">Event camera 介紹：給生物力學研究者</text>
  <text x="60" y="410" font-family="Arial, sans-serif" font-size="11" fill="#fff" opacity="0.72" letter-spacing="1.4">DVS · NEUROMORPHIC VISION · IEEE TPAMI</text>
</svg>
