<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="2026 AI 醫學影像 paper 解讀">
  <defs>
    <linearGradient id="bg-imaging" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e85d4f"/>
      <stop offset="1" stop-color="#0b2545"/>
    </linearGradient>
    <radialGradient id="scan-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0fa19d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0fa19d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-imaging)"/>

  <!-- Subtle scanline grid -->
  <g stroke="#f4efe6" stroke-opacity="0.10" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Three "paper" cards, each with a distinct imaging icon -->

  <!-- Card 1: Medical SAM3 — segmentation mask -->
  <g transform="translate(100 130)">
    <rect x="0" y="0" width="170" height="220" rx="14" fill="#f4efe6" opacity="0.97"/>
    <rect x="0" y="0" width="170" height="34" rx="14" fill="#0fa19d"/>
    <text x="14" y="22" font-family="Arial, sans-serif" font-size="13" fill="#f4efe6" font-weight="700">SAM3 · SEGMENT</text>
    <!-- segmentation: blob with mask outline -->
    <ellipse cx="85" cy="118" rx="58" ry="48" fill="#0b2545" opacity="0.18"/>
    <path d="M 35 118 Q 50 70 95 72 Q 140 80 138 130 Q 130 175 80 168 Q 38 158 35 118 Z" fill="none" stroke="#e85d4f" stroke-width="3" stroke-dasharray="6 4"/>
    <circle cx="85" cy="118" r="5" fill="#d4a434"/>
    <text x="14" y="200" font-family="Arial, sans-serif" font-size="11" fill="#0b2545" font-weight="700">DICE 54.0 → 77.0</text>
  </g>

  <!-- Card 2: RDBCycleGAN-CBAM — CT slice -->
  <g transform="translate(315 130)">
    <rect x="0" y="0" width="170" height="220" rx="14" fill="#f4efe6" opacity="0.97"/>
    <rect x="0" y="0" width="170" height="34" rx="14" fill="#d4a434"/>
    <text x="14" y="22" font-family="Arial, sans-serif" font-size="13" fill="#0b2545" font-weight="700">CYCLEGAN · CT</text>
    <!-- CT-style circular slice with noise -->
    <circle cx="85" cy="118" r="55" fill="#0b2545"/>
    <circle cx="85" cy="118" r="55" fill="url(#scan-glow)"/>
    <circle cx="70" cy="105" r="9" fill="#f4efe6" opacity="0.35"/>
    <circle cx="100" cy="125" r="13" fill="#f4efe6" opacity="0.45"/>
    <circle cx="78" cy="140" r="6" fill="#f4efe6" opacity="0.30"/>
    <circle cx="85" cy="118" r="55" fill="none" stroke="#e85d4f" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="14" y="200" font-family="Arial, sans-serif" font-size="11" fill="#0b2545" font-weight="700">+3.97 dB PSNR</text>
  </g>

  <!-- Card 3: VascFlexMap — vessel network -->
  <g transform="translate(530 130)">
    <rect x="0" y="0" width="170" height="220" rx="14" fill="#f4efe6" opacity="0.97"/>
    <rect x="0" y="0" width="170" height="34" rx="14" fill="#e85d4f"/>
    <text x="14" y="22" font-family="Arial, sans-serif" font-size="13" fill="#f4efe6" font-weight="700">CEUS · VESSEL</text>
    <!-- branching vasculature -->
    <g stroke="#0b2545" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M 40 165 Q 70 120 90 110"/>
      <path d="M 90 110 Q 110 100 130 70"/>
      <path d="M 90 110 Q 110 130 145 145"/>
      <path d="M 70 130 Q 90 140 100 165"/>
      <path d="M 60 95 Q 75 100 90 110"/>
    </g>
    <g fill="#0fa19d">
      <circle cx="90" cy="110" r="4"/>
      <circle cx="40" cy="165" r="3"/>
      <circle cx="130" cy="70" r="3"/>
      <circle cx="145" cy="145" r="3"/>
    </g>
    <text x="14" y="200" font-family="Arial, sans-serif" font-size="11" fill="#0b2545" font-weight="700">28–133 s · H100</text>
  </g>

  <!-- Title bar -->
  <text x="60" y="58" font-family="Arial, sans-serif" font-size="11" fill="#d4a434" letter-spacing="2" font-weight="700">COMMUNITY PICKS · MAY 2026</text>
  <text x="60" y="86" font-family="Arial, sans-serif" font-size="22" fill="#f4efe6" font-weight="700">三篇 AI × 醫學影像 preprint</text>
  <text x="60" y="410" font-family="Arial, sans-serif" font-size="11" fill="#fff" opacity="0.72" letter-spacing="1.4">arXiv · bioRxiv · PREPRINT, 尚未同儕審查</text>
</svg>
