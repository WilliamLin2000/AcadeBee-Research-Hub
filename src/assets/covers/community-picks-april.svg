<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="社群熱門 AI Agent 工具">
  <defs>
    <linearGradient id="bg-agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e85d4f"/>
      <stop offset="1" stop-color="#0b2545"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-agent)"/>

  <g stroke="#f4efe6" stroke-opacity="0.22" fill="none">
    <line x1="150" y1="120" x2="400" y2="225"/>
    <line x1="150" y1="330" x2="400" y2="225"/>
    <line x1="650" y1="120" x2="400" y2="225"/>
    <line x1="650" y1="330" x2="400" y2="225"/>
    <line x1="275" y1="90" x2="400" y2="225"/>
    <line x1="525" y1="360" x2="400" y2="225"/>
  </g>

  <!-- Central agent -->
  <g transform="translate(400 225)">
    <circle cx="0" cy="0" r="58" fill="#d4a434" stroke="#f4efe6" stroke-width="3"/>
    <rect x="-30" y="-20" width="60" height="44" rx="10" fill="#0b2545"/>
    <circle cx="-12" cy="2" r="5" fill="#f4efe6"/>
    <circle cx="12" cy="2" r="5" fill="#f4efe6"/>
    <path d="M -14 18 Q 0 28 14 18" stroke="#f4efe6" stroke-width="3" fill="none" stroke-linecap="round"/>
    <line x1="0" y1="-20" x2="0" y2="-34" stroke="#0b2545" stroke-width="4"/>
    <circle cx="0" cy="-39" r="5" fill="#0fa19d"/>
  </g>

  <!-- Tool cards -->
  <g>
    <rect x="90" y="88" width="120" height="70" rx="12" fill="#f4efe6" opacity="0.95"/>
    <path d="M 122 123 L 112 113 L 122 103 M 178 123 L 188 113 L 178 103" stroke="#e85d4f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="90" y="292" width="120" height="70" rx="12" fill="#f4efe6" opacity="0.95"/>
    <rect x="112" y="307" width="18" height="40" rx="3" fill="#0fa19d"/>
    <rect x="138" y="320" width="18" height="27" rx="3" fill="#d4a434"/>
    <rect x="164" y="301" width="18" height="46" rx="3" fill="#0b2545"/>

    <rect x="590" y="88" width="120" height="70" rx="12" fill="#f4efe6" opacity="0.95"/>
    <path d="M 614 136 L 614 106 L 656 106 L 674 124 L 674 136 Z" fill="#0b2545"/>
    <polyline points="656,106 656,124 674,124" fill="none" stroke="#f4efe6" stroke-width="2"/>

    <rect x="590" y="292" width="120" height="70" rx="12" fill="#f4efe6" opacity="0.95"/>
    <circle cx="625" cy="326" r="8" fill="#0b2545"/>
    <circle cx="650" cy="314" r="8" fill="#0b2545"/>
    <circle cx="675" cy="334" r="8" fill="#0b2545"/>
    <line x1="625" y1="326" x2="650" y2="314" stroke="#0b2545" stroke-width="2"/>
    <line x1="650" y1="314" x2="675" y2="334" stroke="#0b2545" stroke-width="2"/>
  </g>

  <!-- Mini labels -->
  <g font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#07243d" text-anchor="middle">
    <text x="150" y="174">CODE</text>
    <text x="150" y="378">EVAL</text>
    <text x="650" y="174">DOCS</text>
    <text x="650" y="378">WORKFLOW</text>
  </g>

  <text x="60" y="58" font-family="Arial, sans-serif" font-size="11" fill="#d4a434" letter-spacing="2" font-weight="700">COMMUNITY PICKS · AI AGENT</text>
  <text x="60" y="410" font-family="Arial, sans-serif" font-size="11" fill="#fff" opacity="0.72" letter-spacing="1.4">TOOLS · BENCHMARKS · SAFETY PRACTICE</text>
