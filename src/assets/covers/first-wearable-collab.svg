    <path d="M 24 218 Q 74 170 114 186 T 196 118" stroke="#f4efe6" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Center bridge -->
  <g transform="translate(400 225)">
