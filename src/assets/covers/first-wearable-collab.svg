  <!-- Three lessons -->
  <g font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">
    <line x1="325" y1="124" x2="475" y2="124" stroke="#f4efe6" stroke-width="1.5" opacity="0.5"/>
    <circle cx="350" cy="124" r="14" fill="#e85d4f"/><text x="350" y="129" font-size="12" fill="#07243d">1</text>
    <circle cx="400" cy="124" r="14" fill="#0fa19d"/><text x="400" y="129" font-size="12" fill="#07243d">2</text>
    <circle cx="450" cy="124" r="14" fill="#e85d4f"/><text x="450" y="129" font-size="12" fill="#07243d">3</text>
  </g>

  <text x="60" y="58" font-family="Arial, sans-serif" font-size="11" fill="#d4a537" letter-spacing="2" font-weight="700">CROSS-DOMAIN COLLAB</text>
  <text x="60" y="410" font-family="Arial, sans-serif" font-size="11" fill="#fff" opacity="0.72" letter-spacing="1.4">PROBLEM ALIGNMENT · PROJECT FOCUS · TEAM RHYTHM</text>
